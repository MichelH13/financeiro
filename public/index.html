<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro - Controle Financeiro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <div class="login-card">
        <div class="logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <h1>Financeiro</h1>
        <p class="subtitle">Gerencie suas financas pessoais com facilidade</p>
        
        <button id="google-login-btn" class="google-btn">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Entrar com Google
        </button>
        
        <p class="terms">Ao entrar, voce concorda com nossos termos de uso</p>
      </div>
    </div>
  </div>

  <!-- App Screen -->
  <div id="app-screen" class="screen hidden">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="header-left">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <h1>Danilo Santos</h1>
        </div>
        <div class="header-right">
          <span id="user-name"></span>
          <img id="user-avatar" src="" alt="Avatar" class="avatar">
          <button id="logout-btn" class="logout-btn">Sair</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Summary Cards -->
      <section class="summary-cards">
        <div class="card income-card">
          <div class="card-icon income-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </div>
          <div class="card-info">
            <span class="card-label">Receitas</span>
            <span id="total-income" class="card-value income-value">R$ 0,00</span>
          </div>
        </div>
        
        <div class="card expense-card">
          <div class="card-icon expense-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12l7 7 7-7"/>
            </svg>
          </div>
          <div class="card-info">
            <span class="card-label">Despesas</span>
            <span id="total-expenses" class="card-value expense-value">R$ 0,00</span>
          </div>
        </div>
        
        <div class="card balance-card">
          <div class="card-icon balance-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div class="card-info">
            <span class="card-label">Saldo</span>
            <span id="total-balance" class="card-value">R$ 0,00</span>
          </div>
        </div>
      </section>

      <!-- Content Grid -->
      <div class="content-grid">
        <!-- Transaction Form -->
        <section class="form-section">
          <h2>Nova Transacao</h2>
          <form id="transaction-form">
            <div class="form-group">
              <label for="description">Descricao</label>
              <input type="text" id="description" placeholder="Ex: Salario, Mercado..." required>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="amount">Valor (R$)</label>
                <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
              </div>
              
              <div class="form-group">
                <label for="type">Tipo</label>
                <select id="type" required>
                  <option value="income">Receita</option>
                  <option value="expense">Despesa</option>
                </select>
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="category">Categoria</label>
                <select id="category" required>
                  <option value="Salario">Salario</option>
                  <option value="Freelance">Freelance</option>
                  <option value="Investimentos">Investimentos</option>
                  <option value="Alimentacao">Alimentacao</option>
                  <option value="Transporte">Transporte</option>
                  <option value="Moradia">Moradia</option>
                  <option value="Saude">Saude</option>
                  <option value="Educacao">Educacao</option>
                  <option value="Lazer">Lazer</option>
                  <option value="Outros">Outros</option>
                </select>
              </div>
              
              <div class="form-group">
                <label for="date">Data</label>
                <input type="date" id="date" required>
              </div>
            </div>
            
            <button type="submit" class="submit-btn">Adicionar Transacao</button>
          </form>
        </section>

        <!-- Transaction List -->
        <section class="list-section">
          <h2>Transacoes Recentes</h2>
          <div id="transaction-list" class="transaction-list">
            <p class="empty-message">Nenhuma transacao encontrada</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Loading Overlay -->
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
