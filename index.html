<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Calculadora de KM Mobile</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <h2>Calculadora de KM</h2>
            <p>Toque no mapa para marcar o local exato</p>
        </header>

        <section class="controls">
            <div class="input-group">
                <label>Sua Casa (Início/Fim)</label>
                <input type="text" id="home-input" placeholder="Endereço ou toque no mapa" onchange="buscar(this)">
            </div>

            <div id="markets-list">
                <!-- Nomes dos mercados aparecerão aqui -->
            </div>
            
            <div class="button-row">
                <button class="btn-add" onclick="addMarket()">+ Mercado</button>
                <button class="btn-calc" onclick="calculate()">Calcular Rota</button>
            </div>
        </section>

        <div id="map"></div>

        <section id="res-container" class="result-bar" style="display:none">
            <div class="res-item">
                <strong>Distância:</strong> <span id="km-val">0,00</span> KM
            </div>
            <div class="res-item">
                <strong>Receber:</strong> <span id="money-val">R$ 0,00</span>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
